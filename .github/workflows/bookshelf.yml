# Refreshes the About page bookshelf every 12 hours: "Now reading" from the Goodreads profile, "Recently finished"
# from books/finished.json (also rebuilt whenever that file changes, or on demand from the Actions tab).
# Commits only when the shelf actually changed, then asks Pages to rebuild.
name: Update bookshelf

on:
  schedule:
    - cron: "17 10,22 * * *" # every 12 hours, ~6am and ~6pm Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: [books/finished.json]

permissions:
  contents: write
  pages: write

concurrency:
  group: bookshelf
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0
      - run: python .github/scripts/reading.py
      - name: Commit and rebuild Pages if the shelf changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add about/index.html books
          if git diff --cached --quiet; then echo "Shelf unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bookshelf: update from Goodreads"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the push should still trigger one"
